[build-system]
# Floor at the 1.27 line (2.3), the first with PEP 639 `license` and
# `license-files` support. Every release from 1.22 up is clean per
# Sonatype (2026-10).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "pytrove"
dynamic = ["version"]
description = "Utilities for async applications, data handling, files, archives and Telegram"
requires-python = ">=3.10"
authors = [{ name = "Abdullah", email = "aldheeb01@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["utilities", "asyncio", "archive", "telegram", "validation", "json"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

# Rule 2.3: every dependency has a version floor and no upper bound unless a
# real compatibility break needs one; the reason for each floor is beside it.
# "Clean" means the floor has no known vulnerability (checked 2026-10-17).
dependencies = [
    # Backports the newer `typing` names the library imports below 3.13. 4.4 is the
    # first release with `TypeVar(default=...)` (PEP 696); 4.1 adds `Never`/`Unpack`.
    # Below 4.4, `import pytrove` fails on 3.10-3.12.
    "typing_extensions>=4.4; python_version<'3.13'",
]


[project.urls]
"Homepage" = "https://github.com/eeeob/pytrove"
"Source" = "https://github.com/eeeob/pytrove"
"Issues" = "https://github.com/eeeob/pytrove/issues"
"Releases" = "https://github.com/eeeob/pytrove/releases"

[project.optional-dependencies]
mongo = [
    # Every 4.x up to 4.18.0 carries CVE-2026-96748; 4.19.0 is the first
    # release with no known vulnerability, and it requires Python 3.11, so
    # the extra installs nothing on 3.10: `MongoIndex` raises the usual
    # missing-extra error there rather than pulling a vulnerable release.
    "pymongo>=4.19.0; python_version >= '3.11'",
]
country = [
    # Floors set when the feature was added; clean.
    "pycountry>=26.2.16",
    "phonenumbers>=9.0.21",
]
crypto = [
    # Earlier releases carry CVE-2026-69247 and CVE-2026-69249.
    "cryptography>=50.0.0",
]
bs4 = [
    # Floor set when the feature was added; clean.
    "beautifulsoup4>=4.14.3",
]
imap = [
    # Floor set when the feature was added; clean.
    "aioimaplib>=2.0.1",
]
phone = [
    # Floor set when the feature was added; clean.
    "phonenumbers>=9.0.21",
]
tg = [
    # 2.2.24 is the first release with `pyrogram.types.InputRichMessage`, which
    # `models.template_models` imports; below it the tg feature cannot load.
    # Clean (Sonatype, 2026-10).
    "kurigram>=2.2.24",
]
typecheck = [
    # Floor set when the feature was added; clean.
    "typeguard>=4.3",
]
proxy = [
    # Floor set when the feature was added; clean.
    "wrapt>=1.16",
]
locale = [
    # Floor set when the feature was added; clean.
    "babel>=2.14",
]
json = [
    # `$ref` resolution. Floor set when the feature was added; clean.
    "jsonref>=1.1",
    # The fast path for JSON I/O; without it the standard `json` is used.
    # 3.9.0 carries CVE-2024-27454 and 3.10 through 3.11.5 carry CVE-2025-67221.
    "orjson>=3.11.7",
]
archive = [
    # Floor set when the feature was added; clean. 3.14 uses the stdlib
    # `compression.zstd` instead.
    "zstandard>=0.22; python_version < '3.14'",
    # fastzip fails to import on Windows (its _crc32_combine loads libz via
    # ctypes.util.find_library("z"), which finds nothing there), so it is
    # installed only where it actually works; compress_folder's `workers`
    # just falls back to the serial zipfile writer where it is absent.
    # Floor set when the feature was added; clean.
    "fastzip>=0.5; sys_platform != 'win32'",
    # Floor set when the feature was added; clean.
    "pathspec>=1.0",
]

# Every optional group above, so `full` installs all optional features.
full = [
    "pytrove[imap,phone,country,bs4,mongo,tg,crypto,typecheck,proxy,locale,json,archive]"
]

# Tooling is not something a user of the library installs, so it lives in
# dependency groups (PEP 735) rather than extras: `uv sync` takes them from
# `uv.lock`, and `pip install pytrove[dev]` is not a thing anyone can type.
# `make` is the only place these commands are written down (see `Makefile`
# and the development section of `CONTRIBUTING.md`).
[dependency-groups]
# The aggregate `uv sync` installs by default. It lists groups, never
# packages, so every package below sits in a group that says what it is for.
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "devtools" },
]
lint = [
    # Pinned exactly: ty is pre-1.0 and each release can add or change
    # diagnostics, which would fail CI with no change in the code.
    "ty==0.0.88",
    # Pinned exactly for the same reason as ty: a new release can add or
    # change lint rules, which would fail the checks with no change in the code.
    "ruff==0.17.1",
    # Runs `make lint` and `make typecheck` before each commit, optionally.
    # Floor set when the hooks were added; clean.
    "pre-commit>=4.5",
]
test = [
    # Earlier releases (8.x through 9.0.2) carry CVE-2025-71176.
    "pytest>=9.0.3",
    # Floor set when the async tests were added; clean.
    "pytest-asyncio>=0.24",
]
# What the generators under `devtools/` need and the library does not. Only
# TOML reading, and only below 3.11, which ships `tomllib`; on 3.11 and newer
# the group installs nothing. Nothing here reaches the wheel.
devtools = [
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.sdist]
# An allowlist, so a new top-level file never leaks into the archive by
# accident. `devtools/` is included on purpose: the generators are part of
# the source, even though they never reach the wheel.
include = ["/pytrove", "/tests", "/devtools"]

[tool.hatch.version]
path = "pytrove/__init__.py"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["pytrove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Test files mirror the library per section, so basenames repeat across directories.
addopts = "--import-mode=importlib"

# The tooling half of `CONTRIBUTING.md`: each selected rule set names the rule
# it enforces, and each ignore says why. It does not replace that file: every
# rule there binds equally, including the ones no tool can check (ordering,
# file layout, documentation content, tests). `make lint` and `make typecheck`
# run exactly this configuration, locally and in CI.
[tool.ruff]
target-version = "py310"
# PEP 695 syntax, imported only on 3.12+ (see `typings/core.py`).
per-file-target-version = { "pytrove/typings/_core_py312.py" = "py312" }

[tool.ruff.lint]
select = [
    "F",       # 3.3: no unused imports; 1.9: no wildcard imports
    "UP",      # 4.1: built-in generics and `|` unions; 4.2: UP037, no quoted annotations
    "I002",    # 4.2: the `__future__` import in every module
    "ANN",     # 4.6: complete type hints
    "EM",      # 4.5: exception messages assigned to a variable first
    "S101",    # 4.5: no `assert` runtime guards
    "PGH",     # 4.7: no bare `type: ignore`, no blanket `noqa`
    "D",       # 5.3-5.5: Google-style docstrings
    "B",       # 5.1: likely bugs (mutable defaults, unchecked `zip`, loop closures)
    "C4",      # 5.1: no redundant comprehensions or `dict()`/`list()` calls
    "E9",      # syntax and IO errors
    "EXE",     # shebangs match the executable bit
    "ICN",     # conventional import aliases
    "INP",     # 0.1/1.8: every package has an `__init__.py`
    "INT",     # `gettext` calls take literal strings
    "ISC",     # 5.1: no implicit string concatenation
    "LOG",     # correct `logging` calls
    "PIE",     # 5.1: no unnecessary statements or duplicate members
    "PLC",     # 3.3: imports at the top of the module; pylint conventions
    "PLE",     # pylint errors
    "PLW",     # pylint warnings (overwritten loop variables, `subprocess` checks)
    "PYI",     # 4.1/4.6: well-formed type definitions and overloads
    "RSE",     # no redundant parentheses on `raise`
    "RUF013",  # 4.1: no implicit `Optional` from a `None` default
    "SLOT",    # `__slots__` on `str`/`tuple` subclasses
    "T10",     # no leftover debugger calls
    "W",       # no trailing whitespace
    "YTT",     # 1.1: correct `sys.version_info` comparisons
    "TC",      # 4.2: imports used only in annotations go under `if TYPE_CHECKING:`
]
ignore = [
    "ANN401",  # 4.6 forbids `Any` only as a way around a type error, not everywhere
    "TC006",   # 4.2 forbids quoted annotations, so a `cast` target stays a real name
]

[tool.ruff.lint.flake8-bugbear]
# An immutable `NamedTuple`, so a shared default instance is safe (`B008`).
extend-immutable-calls = ["pytrove.typings.ArchiveLimits"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations as _annotations"]

[tool.ruff.lint.flake8-type-checking]
# Dataclass annotations stay real imports: `BaseDataClass` resolves its
# fields' hints at runtime to find enums (`_resolved_hints` in
# `models/_internal.py`), and `dataclasses` reads `ClassVar` on class creation.
runtime-evaluated-decorators = ["dataclasses.dataclass"]
runtime-evaluated-base-classes = ["pytrove.models.base.BaseDataClass"]
# The backport of `typing`, imported in the same `sys.version_info` branches.
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 1.9: wildcard imports are allowed only in interface-aggregation files, which
# name their submodules only through those imports (F405) and, having no
# annotations, omit the `__future__` import (I002, the exception in 4.2). Their
# `__all__ = (*a.__all__, ...)` concatenation, which 1.9 requires, is not a
# literal that `PLE0604` can read.
"**/__init__.py" = ["F401", "F403", "F405", "I002", "PLE0604"]
# Tests assert by design, and 5.3 covers library functions, not test cases.
# `tests/` has no `__init__.py` on purpose: pytest runs with
# `--import-mode=importlib`, so test files with the same basename never clash.
"tests/**" = ["S101", "D", "INP001"]
# `devtools/` and each tool root are namespace packages by design: a tool root
# holds only its `__main__.py` door beside named sections (`devtools/README.md`,
# `Layout` in `devtools/_preflight/layout.py`), so a door has no `__init__.py`.
"devtools/__main__.py" = ["INP001"]
"devtools/*/__main__.py" = ["INP001"]

[tool.ty.environment]
# Fixed, so a check gives the same verdict on every machine: the 3.10 floor's
# syntax and `sys.version_info` branches, and Linux, where CI runs. Left to
# the host, Windows-only `stat` fields read as resolved on Windows and as
# errors on Linux, and their `ty: ignore` comments as unused on Windows.
python-version = "3.10"
python-platform = "linux"

[tool.ty.src]
# PEP 695 syntax, imported only on 3.12+ (see `typings/core.py`); checked on
# its own with `ty check --python-version 3.12 pytrove/typings/_core_py312.py`.
exclude = ["pytrove/typings/_core_py312.py"]

[tool.ty.rules]
# `safe_call`, `to_thread` and `maybe_awaitable` take their own keyword-only options
# between `*args: _P.args` and `**kwargs: _P.kwargs`, which PEP 612 does not allow.
# The design is kept on purpose; each call site that cascades from it carries a
# `ty: ignore[...]` naming this. Every other rule is enforced.
invalid-paramspec = "ignore"
