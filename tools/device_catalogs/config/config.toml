#  device_catalogs -- the values decided by hand
#  =============================================
#
#  Read by `tools/_preflight`. Not everything a generator needs can be
#  fetched. Nobody publishes the share of machines running Windows 11; the
#  Android API level table is typed out of a documentation page; the glibc
#  versions in the Linux pool were read off a package index. Each of those is
#  a decision, and a decision goes stale in the quietest way there is -- the
#  build keeps working, the tests keep passing, and the numbers simply stop
#  describing the world.
#
#  So each [[watch]] records the decision next to the one number upstream can
#  still be asked for: `value` is what the code currently reflects, and the
#  fingerprint says how to read today's answer. A difference is reported on
#  every run until somebody revisits the decision and edits `value` here --
#  deliberately not re-recorded in the lock, because the point is to keep
#  saying so.
#
#  A watch never stops a build. The generator does not request any of these
#  URLs; nothing is cached from them and nothing is parsed out of them beyond
#  one integer. A page that moved is news, not an obstacle, so it is reported
#  and -- if it stays broken for three weeks -- escalated, and never gated.
#
#  What belongs here is a value the code cannot justify by itself. What does
#  not: anything the tool actually fetches (sources/sources.toml) and any rule
#  it reimplemented from somebody else's source (ported/citations.toml). The
#  values themselves stay on the classes that use them, as every constant in
#  this project does; this file holds the evidence, not the number.


[[watch]]
id = "android_api_levels"
url = "https://source.android.com/docs/setup/reference/build-numbers"
#: The newest API level the table carries.
value = 37
used_by = """
src/android.py :: AndroidBuilder.API_LEVELS, and through it sdk_at(),
sdk_of_android(), release_of_sdk() and MIN_SDK"""
decision = """
Typed out rather than parsed: the page is a 340 KB HTML document whose tables
are generated, so a parser over it would be the most fragile thing in the
tool, and the table itself is five rows that change once a year.

When this moves, a new Android release has shipped. Add the row -- api,
version string, release date -- and the generator dates every device against
it: `sdk_at` derives a launch level from a release date, and `MAX_OS_UPGRADES`
then allows the range up from there. Nothing else needs touching.
"""
notes = """
The fingerprint reads the largest "API level N" on the page, which is the
only number on it with a stable spelling. It matches the preview levels too
if Google lists one, so a bump may mean a developer preview rather than a
release -- check the release date column before adding the row."""

  [watch.fingerprint]
  kind = "regex_max_int"
  pattern = 'API level (\d+)'


[[watch]]
id = "windows_releases"
url = "https://endoflife.date/api/windows.json"
#: The newest Windows major with a release cycle.
value = 11
used_by = "src/desktop.py :: DesktopBuilder.WINDOWS_VERSIONS"
decision = """
The strings are lib_base's and the weights are a judgement: no feed publishes
the share of machines on each Windows version, and the three rows here are
read off survey data by hand.

When this moves, a new Windows major exists and `SystemVersionPretty` will
start reporting it. Add the row with its own weight and take that weight off
the older ones -- and do it, because a catalog that offers only Windows 11
the year Windows 12 ships is offering a version mix no population has.
"""
notes = """
This feed is also read by hand for the release dates behind each row's
`released` field, which is what the recency weighting uses. Only the major is
watched: endoflife.date splits Windows 11 into one cycle per feature update
(11-26h2-e and so on), and none of that reaches a device string."""

  [watch.fingerprint]
  kind = "regex_max_int"
  pattern = '"cycle":\s*"(\d+)'


[[watch]]
id = "glibc_versions"
url = "https://repology.org/api/v1/project/glibc"
#: The newest glibc 2.x minor the LIBC table carries.
value = 43
used_by = "src/desktop.py :: DesktopBuilder.LIBC"
decision = """
A Linux version string ends with the libc, and which versions are actually in
use is a property of what distributions ship -- not something lib_base or any
Telegram source can answer. The table is nine glibc versions with weights
read off distribution release data, plus one empty entry for the musl
machines, where `SystemVersionPretty` omits the clause entirely.

When this moves, a new glibc has been released (they come in February and
August). Add it with a small weight -- a release takes a year or two to reach
most distributions -- and shade the oldest entries down rather than dropping
them, because long-term distributions keep them alive for years.
"""
notes = """
The pattern deliberately requires the closing quote, so it matches a plain
`2.44` and not the `2.44.9000` and `2.44.9999` development snapshots that
rolling-release packagers publish ahead of a release. Without that, the watch
would announce every glibc release months early, every time."""

  [watch.fingerprint]
  kind = "regex_max_int"
  pattern = '"version":\s*"2\.(\d+)"'
