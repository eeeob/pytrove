name: Tests

on:
  # Branches live in this repository and are tested through their pull
  # request, so an unfiltered `push` would run everything twice per commit.
  push:
    branches: [main]
  pull_request:
  # Every job below installs from `uv.lock`, so a dependency release
  # published after the last `uv lock` is exercised by nothing until somebody
  # relocks. `test-ceil` resolves fresh and is what catches it, which only
  # helps if something runs it without a push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# The jobs only check out and run the suite, so the token can read and nothing more,
# whatever the repository's default token permissions are.
permissions:
  contents: read

# Every step calls a `make` recipe: the Makefile is the only place the
# commands are written down, shared with pre-commit and CONTRIBUTING.md.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      # `uv` supplies the interpreter as well as the packages, so there is no
      # separate Python setup step.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment with every extra
        run: make sync

      - name: Run tests
        run: make test

      - name: Run docstring examples
        run: make test-doctest

  # CONTRIBUTING 0.3: `pip install pytrove` with no extras must import and
  # pass the whole suite, every extra-dependent test skipping on its own.
  test-minimal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Import and test the bare package
        run: make test-minimal

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install the locked environment
        run: make sync

      - name: Run ruff
        run: make lint

  # Its own job rather than a tail step of `lint`: a `ruff` failure would
  # otherwise hide the `ty` verdict until the next push. 3.11 is the oldest
  # interpreter that installs every extra (`mongo` needs 3.11); the recipe
  # still checks against the 3.10 floor, and `ty` 0.0.88 overflows its stack
  # against the 3.14 interpreter, so it is not the newest either.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the locked environment with every extra
        run: make sync

      - name: Run ty
        run: make typecheck

  # The recipes name their interpreter and `uv` provisions it, so neither of
  # these jobs pins one: `setup-uv`'s `python-version` would export
  # `UV_PYTHON` over the whole job.
  test-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Test the lowest version every floor allows, on the oldest Python
        run: make test-floor

  test-ceil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Test the newest release of every dependency, on the newest Python
        run: make test-ceil
