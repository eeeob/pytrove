#  device_catalogs -- the rules this tool did not invent
#  =====================================================
#
#  Read by `devtools/_preflight`. Some of what the generator emits is not data it
#  collected but a rule it reimplemented from somebody else's source: lib_base
#  decides what a desktop model string looks like, Chromium freezes its own
#  platform tokens, Telegram Android concatenates two Build fields with no
#  separator between them. Those files were read once by a human and then
#  quoted in a comment -- and a comment cannot notice that the rule moved, so
#  the port goes on producing strings the client would no longer produce and
#  nothing in a build fails.
#
#  So each entry names the exact lines the port rests on, and the check asks
#  upstream whether they are still there. All of `anchors` must be present; a
#  missing one is fatal, because it means the premise of a port is gone and
#  the only honest response is to read the file again.
#
#  `anchors` are substrings, never line numbers. Line numbers drift on their
#  own: the Android model line was cited at 224 and now sits at 228, having
#  not changed at all. An anchor is quoted exactly as upstream writes it,
#  including the tabs-to-spaces it uses, so it is worth copying rather than
#  retyping.
#
#  These are deliberately not [[source]] entries. Nothing is fetched into the
#  cache and nothing is generated from the body, and fingerprinting a live
#  source file would report a change every week that nobody can act on. The
#  one question worth asking is whether the quoted rule survives.
#
#  Already a [[source]] and so absent from here: MTApiEnvironment.m. The iOS
#  model strings are not ported from it, they are parsed out of it on every
#  build, so it carries a contract and a fingerprint instead.


# ===========================================================================
#  Telegram clients
# ===========================================================================

[[citation]]
id = "telegram_android_identity"
url = "https://raw.githubusercontent.com/DrKLO/Telegram/master/TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java"
anchors = [
  "deviceModel = Build.MANUFACTURER + Build.MODEL;",
  'systemVersion = "SDK " + Build.VERSION.SDK_INT;',
]
ported_to = """
src/android.py :: AndroidBuilder.MODEL_FORMAT, VERSION_FORMAT and the model
strings themselves (manufacturer + code, no separator); the catalog's
`model` field for every one of its 910 devices"""
on_drift = """
Every Android row in the catalog. The two anchors are the entire format: a
separator appearing between the manufacturer and the model, or a different
spelling of the SDK string, would make all 910 model strings wrong -- each
one a value no real handset sends."""
notes = """
The concatenation really is unseparated, which is why it is quoted whole
rather than as two fragments: `samsung` + `SM-S928B` is `samsungSM-S928B`.
The server rewrites it for display, so a wrong string still *shows* as a
plausible phone -- which is exactly why this needs checking rather than
eyeballing."""


[[citation]]
id = "telegram_ios_model_source"
url = "https://raw.githubusercontent.com/TelegramMessenger/Telegram-iOS/master/submodules/TelegramUI/Sources/AppDelegate.swift"
anchors = ["deviceModelName: nil"]
ported_to = """
src/ios.py :: IOSBuilder.telegram_names(), which parses platformString out
of MTApiEnvironment.m instead of using Apple's marketing names"""
on_drift = """
The premise of the whole iOS catalog. Passing nil here is what makes the
client fall back to its own hardcoded platformString table -- so if the app
starts passing a real device name, the catalog is reading the wrong table and
every one of its 35 models is the wrong kind of string."""


