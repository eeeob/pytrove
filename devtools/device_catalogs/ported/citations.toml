[[citation]]
id = "libbase_linux"
url = "https://raw.githubusercontent.com/desktop-app/lib_base/master/base/platform/linux/base_info_linux.cpp"
anchors = [
  'const auto productName = value("product_name");',
  'const auto productFamily = value("product_family");',
  'const auto boardName = value("board_name");',
  'process.start("systemd-detect-virt", QStringList());',
  "const auto chassisType = ChassisTypeToString(",
  "resultList << u.sysname;",
  "#ifndef Q_OS_LINUX",
  "resultList << u.release;",
  'resultList << "Xwayland";',
  "const auto libcName = GetLibcName();",
]
ported_to = """
src/libbase.py :: LibBase.device_model_from_dmi();
src/desktop.py :: DesktopBuilder.unix_versions(), KERNELS, DESKTOPS,
SESSIONS, LIBC, LINUX_VIRT, LINUX_CHASSIS, LINUX_DOC"""
on_drift = """
The Linux half of the desktop catalog -- 543 version strings and the
virtualisation and chassis fallbacks in the model pool. The `#ifndef
Q_OS_LINUX` guard is the reason a Linux row carries no kernel release while a
BSD row does; losing it would make every Linux version string too short by
one component, and nothing else in the tool would notice."""
notes = """
`u.release` is quoted together with the guard on purpose: the line on its own
is unremarkable, and it is the guard around it that the port depends on.
GetLibcName is quoted rather than the __GLIBC__ blocks, which appear six
times for unrelated reasons; the libc clause is omitted entirely outside
glibc, which is why a musl distribution reports a three-part string."""


