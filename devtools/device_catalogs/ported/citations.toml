and the Linux value is assembled from uname -- so this is also where the
`Linux x86_64` spelling in the catalog comes from."""
notes = """
WebKit is cited although Safari is not in the catalog: every engine
implements navigator.platform the same way and this is the clearest
statement of it. Safari stays out because its Version/x.y suffix is
published in no machine-readable feed."""


