on_drift = """
All nine Firefox user agents, and with them the only non-Chromium template in
the catalog -- the one row that proves the generator is not simply emitting
one shape. UA_SPARE_PLATFORM is why Firefox on Windows alone drops the
platform token, which is the single most easily mis-ported detail here."""
notes = """
`#ifdef XP_WIN` is an anchor in its own right because UA_SPARE_PLATFORM being
Windows-only is the whole point: defined unconditionally, every Firefox row
would lose its platform token. Note also that Gecko spells macOS `10.15`
where Chromium writes `10_15_7`, which is why both spellings sit in the
pairing table."""


